<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>MAYA VIETNAM</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  
  <!-- Font chữ hiện đại -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
  
  <!-- Kết nối file CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><b>MAYA VIETNAM</b><span>SALE MANAGEMENT</span></div>
      <button class="btn pri newbtn" data-act="neworder" id="newbtn"></button>
      <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
      <div class="langsw" role="group" aria-label="Ngôn ngữ / Language" data-noi18n>
        <button type="button" data-act="lang" data-id="vi" aria-pressed="true">Tiếng Việt</button>
        <button type="button" data-act="lang" data-id="en" aria-pressed="false">English</button>
      </div>
      <div class="side-note">
        <span class="dbs" id="dbs"><i></i><span>Đang kết nối dữ liệu</span></span>
        <span>Hôm nay: <b id="todayLbl"></b></span>
        <span>Đơn từ sheet là dữ liệu nhập sẵn. Mục gắn nhãn <span class="tag">MẪU</span> là dữ liệu thêm để thử.</span>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  
  <div id="drawer" aria-hidden="true"><div class="ov" data-act="close"></div><div class="dr" id="dr" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" hidden></div>

  <!-- Thư viện bên ngoài -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  
  <!-- Kết nối các file dữ liệu và Logic -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
