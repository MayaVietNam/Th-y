  const sug=has&&reg>0&&u.used.length<minD?R.act:0;
  const other=l.om?(+l.other||0):sug;
  const disc=Math.round(base*(+l.dpct||0)/100);
  const ex=base-disc+(+l.ins||0)+(+l.ship||0)+other;
  const vat=Math.round(ex*(+vatPct||0)/100);

}

function stPending(){

  ORD.forEach(o=>o.lines.forEach((l,i)=>{if(!isPhys(l)||!l.s||!l.e||l.inv||l.e>=TODAY)return;if(used.has(o.code+'|'+i))return;

function stParts(l,r,vatPct){

    return{from:a,to:b,days:x.n*q,qty:qn,price:+l.price||0,base,disc:Math.round(base*dp/100),ins:0,ship:0,other:0,note:q>1?'Đăng ký '+q+' gói/ngày':'',en:q>1?'Registered '+q+' packages/day':''}});

  const f=out[0];f.ins=+l.ins||0;f.ship=+l.ship||0;f.other=r.other||0;
  const pc=stRules().minPct;
  const low=r.hold==='flat'||(r.has&&r.usedN<r.minD);
  const hn=r.other?(r.hold==='all'?'Phí giữ máy '+r.reg+' ngày (không sử dụng)':low?'Phí giữ máy (dùng dưới '+pc+'% thời gian đăng ký)':'Phí giữ máy'):'';

  return out;
}

(function(){
  const iso=v=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);if(!m)return null;const d=new Date(+m[3],+m[2]-1,+m[1]);return d.getFullYear()==+m[3]&&d.getMonth()==+m[2]-1&&d.getDate()==+m[1]?m[3]+'-'+m[2]+'-'+m[1]:null};
  const push=(tw,val)=>{if(tw.value===val)return;tw.value=val;tw.dispatchEvent(new Event('input',{bubbles:true}));tw.dispatchEvent(new Event('change',{bubbles:true}))};
  document.addEventListener('input',ev=>{
    const t=ev.target;if(!(t.classList&&t.classList.contains('dt')))return;
    const d=t.value.replace(/\D/g,'').slice(0,8);let o=d.slice(0,2);if(d.length>2)o+='/'+d.slice(2,4);if(d.length>4)o+='/'+d.slice(4);
    if(ev.inputType!=='deleteContentBackward')t.value=o;
    const tw=t.parentNode.querySelector('.dtn');
    if(!t.value){push(tw,'');return}
    const v=iso(t.value);if(v)push(tw,v);
  },true);
  document.addEventListener('focusout',ev=>{
    const t=ev.target;if(!(t.classList&&t.classList.contains('dt')))return;
    const tw=t.parentNode.querySelector('.dtn');const v=iso(t.value);
    if(t.value&&!v){t.value=tw.value?tw.value.split('-').reverse().join('/'):''}
  });
  document.addEventListener('change',ev=>{
    const t=ev.target;if(!(t.classList&&t.classList.contains('dtn')))return;
    const tx=t.parentNode.querySelector('.dt');if(tx)tx.value=t.value?t.value.split('-').reverse().join('/'):'';
  },true);
  window.dtPick=b=>{const tw=b.parentNode.querySelector('.dtn');try{tw.showPicker()}catch(e){tw.focus();tw.click()}};
})();

/* ============ NGÔN NGỮ GIAO DIỆN: VI / EN ============ */
const I18N={lang:'vi',map:null,re:null,cache:new Map(),orig:new Map(),attrs:[],obs:null};
try{I18N.lang=localStorage.getItem('mayaLang')==='en'?'en':'vi'}catch(e){}
const I18N_VI=/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;
function i18nBuild(){
  const m=Object.assign({},I18N_DICT);
  try{Object.keys(CTRY_EN).forEach(k=>{const v=CTRY[k];if(v&&CTRY_EN[k]&&!m[v])m[v]=CTRY_EN[k]})}catch(e){}
  Object.keys(I18N_DICT).forEach(k=>{const v=I18N_DICT[k];const c=k[0],lc=c.toLowerCase(),uc=c.toUpperCase();if(c===lc&&c!==uc){const K=uc+k.slice(1);if(m[K]===undefined&&v)m[K]=v[0].toUpperCase()+v.slice(1)}else if(c===uc&&c!==lc&&k!==k.toUpperCase()){const K=lc+k.slice(1);if(m[K]===undefined&&v&&!/^[A-Z]{2,}/.test(v))m[K]=v[0].toLowerCase()+v.slice(1)}});
  const keys=Object.keys(m).sort((a,b)=>b.length-a.length);
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
  const L='[\\p{L}\\p{N}]';
  I18N.map=m;
  I18N.re=new RegExp(keys.map(k=>(new RegExp('^'+L,'u').test(k)?'(?<!'+L+')':'')+esc(k)+(new RegExp(L+'$','u').test(k)?'(?!'+L+')':'')).join('|'),'gu');
}
function i18nStr(s){
  if(!I18N_VI.test(s))return s;
  let r=I18N.cache.get(s);if(r!==undefined)return r;
  if(!I18N.re)i18nBuild();
  r=s.replace(I18N.re,x=>I18N.map[x]!==undefined?I18N.map[x]:x).replace(/(\d)\s?[đĐ](?![\p{L}\p{N}])/gu,'$1 VND');
  if(I18N.cache.size>4000)I18N.cache.clear();
  I18N.cache.set(s,r);return r;
}
const I18N_SKIP=n=>n.closest&&n.closest('.paper,script,style,textarea,[data-noi18n]');
function i18nApply(root){
  if(I18N.lang!=='en'||!root||root.isConnected===false||(root.nodeType===3&&!root.parentNode))return;
  const tw=document.createTreeWalker(root.nodeType===3?root.parentNode:root,NodeFilter.SHOW_TEXT);
  const nodes=[];if(root.nodeType===3)nodes.push(root);else while(tw.nextNode())nodes.push(tw.currentNode);
  nodes.forEach(n=>{
    const v=n.nodeValue;if(!v||!I18N_VI.test(v))return;
    const p=n.parentNode;if(!p||I18N_SKIP(p))return;
    const lead=v.match(/^\s*/)[0],trail=v.match(/\s*$/)[0];
    const t=i18nStr(v.trim());if(t===v.trim())return;
    if(!I18N.orig.has(n))I18N.orig.set(n,v);
    n.nodeValue=lead+t+trail;
  });
  if(root.nodeType===1){
    const els=[root].concat([...root.querySelectorAll('[placeholder],[title],[aria-label]')]);
    els.forEach(e=>{if(I18N_SKIP(e))return;['placeholder','title','aria-label'].forEach(a=>{
      const v=e.getAttribute&&e.getAttribute(a);if(!v||!I18N_VI.test(v))return;
      const t=i18nStr(v);if(t!==v){I18N.attrs.push([e,a,v]);e.setAttribute(a,t)}})});
  }
}
function i18nRestore(){
  I18N.orig.forEach((v,n)=>{if(n.isConnected)n.nodeValue=v});I18N.orig.clear();
  I18N.attrs.forEach(([e,a,v])=>{if(e.isConnected)e.setAttribute(a,v)});I18N.attrs.length=0;
}
function i18nObserve(){
  if(I18N.obs)return;
  I18N.obs=new MutationObserver(recs=>{
    if(I18N.lang!=='en')return;
    I18N.obs.disconnect();
    try{recs.forEach(r=>{
      if(r.type==='childList')r.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)i18nApply(n)});
      else if(r.type==='characterData')i18nApply(r.target);
      else if(r.type==='attributes')i18nApply(r.target);
    })}finally{I18N.obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label']})}
    I18N.attrs=I18N.attrs.filter(x=>x[0].isConnected);
  });
  I18N.obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label']});
}
function i18nSync(){
  document.documentElement.lang=I18N.lang==='en'?'en':'vi';
  document.querySelectorAll('.langsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===I18N.lang)));
}
function setLang(l){
  l=l==='en'?'en':'vi';if(l===I18N.lang){i18nSync();return}
  I18N.lang=l;try{localStorage.setItem('mayaLang',l)}catch(e){}
  if(l==='en'){i18nObserve();i18nApply(document.body)}
  else{i18nRestore();try{render()}catch(e){}}
  i18nSync();
}
(function(){i18nSync();if(I18N.lang==='en'){i18nObserve();i18nApply(document.body)}else i18nObserve()})();
