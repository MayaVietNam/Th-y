<title>MAYA VIETNAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar dọc có biểu tượng + cột làm việc; bảng là chính, ngăn kéo bên phải cho chi tiết và biểu mẫu.
   Màu: nền xám xanh lạnh, mực gần đen, mục đang chọn xanh navy; màu trạng thái tách riêng khỏi màu nhấn. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --ink:#12202B; --ink-2:#47576A; --ink-3:#6C7C8A;
  --line:#DAE2E8; --line-2:#E9EEF2;
  --accent:#0A5C74; --accent-ink:#FFFFFF; --accent-soft:#DDEFF4;
  --nav-on:#1E3A64; --nav-on-ink:#FFFFFF;
  --ok:#1B7A4D; --ok-bg:#E1F3E8;
  --warn:#8F5B00; --warn-bg:#FBEFD2;
  --bad:#B42E27; --bad-bg:#FBE4E2;
  --info:#2A5FC4; --info-bg:#E3EBFB;
  --mute:#4F5F6C; --mute-bg:#E7ECF0;
  --paper:#FFFFFF; --paper-ink:#141B22; --paper-line:#9AA5AF;
  --shadow:0 1px 2px rgba(18,32,43,.06),0 12px 32px rgba(18,32,43,.14);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#16202A; --surface-2:#1B2733;
    --ink:#E7EEF3; --ink-2:#A3B3C0; --ink-3:#8394A2;
    --line:#273643; --line-2:#202D39;
    --accent:#5BC0DB; --accent-ink:#06222B; --accent-soft:#16333E;
    --nav-on:#2B5594; --nav-on-ink:#FFFFFF;
    --ok:#6FD39A; --ok-bg:#15301F;
    --warn:#EBB651; --warn-bg:#352A10;
    --bad:#FF8A82; --bad-bg:#3A1B19;
    --info:#8DB2FF; --info-bg:#182646;
    --mute:#A7B5C0; --mute-bg:#223140;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --surface-2:#1B2733;
  --ink:#E7EEF3; --ink-2:#A3B3C0; --ink-3:#8394A2;
  --line:#273643; --line-2:#202D39;
  --accent:#5BC0DB; --accent-ink:#06222B; --accent-soft:#16333E;
  --nav-on:#2B5594; --nav-on-ink:#FFFFFF;
  --ok:#6FD39A; --ok-bg:#15301F;
  --warn:#EBB651; --warn-bg:#352A10;
  --bad:#FF8A82; --bad-bg:#3A1B19;
  --info:#8DB2FF; --info-bg:#182646;
  --mute:#A7B5C0; --mute-bg:#223140;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--ink-3)}
.sm{font-size:12px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;max-width:1520px;margin:0 auto;padding-block:20px 56px}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-top:4px;max-height:100%;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 10px 14px}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.newbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.ng{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:16px 12px 6px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;
  padding:10px 12px;border-radius:9px;color:var(--ink-2);font-weight:500}
.nav button svg,.btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--line-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--nav-on);color:var(--nav-on-ink);font-weight:600}
.nav .lbl{flex:1;min-width:0}
.badge{font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
.nav button[aria-current="page"] .badge{background:rgba(255,255,255,.2);color:#fff}
.side-note{margin:18px 10px 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.dbs{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dbs i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dbs.on i{background:var(--ok)}.dbs.off i{background:var(--warn)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{border:0;background:none;color:var(--accent);padding:0;font-weight:600;margin-bottom:4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel>h2{margin:0;padding:14px 16px 0;font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2)}
.panel .pb{padding:12px 16px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:500}
.kpi .v{font-size:21px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}
.note{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:500}
.note.info{background:var(--info-bg);color:var(--info)}
.note.bad{background:var(--bad-bg);color:var(--bad)}

.todo{list-style:none;margin:0;padding:6px 0 4px}
.todo li{border-top:1px solid var(--line-2)}
.todo li:first-child{border-top:0}
.todo button{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:11px 16px}
.todo button:hover{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.dot.t-bad{background:var(--bad)}.dot.t-warn{background:var(--warn)}.dot.t-info{background:var(--info)}.dot.t-ok{background:var(--ok)}.dot.t-mute{background:var(--ink-3)}
.todo .tt{font-weight:600}
.todo .ts{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .tn{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.todo .ta{color:var(--ink-3)}

.pcell{font:inherit;font-family:var(--mono,'IBM Plex Mono',monospace);font-variant-numeric:tabular-nums;background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--ink)}.pcell:hover{background:var(--mute-bg);border-color:var(--line,#d8dde3)}.pcell.add{color:var(--mute);min-width:32px}.pcell.off{text-decoration:line-through;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--mute-bg);color:var(--mute)}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-info{background:var(--info-bg);color:var(--info)}.t-mute{background:var(--mute-bg);color:var(--mute)}.t-acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px dashed var(--ink-3);color:var(--ink-3);vertical-align:middle}

.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2);gap:2px}
.bar i{display:block;min-width:4px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;margin-top:12px}
.legend button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;text-align:left}
.legend button:hover{color:var(--accent)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.c-ready{background:var(--ok)}.c-rented{background:var(--accent)}.c-hold{background:var(--info)}.c-overdue{background:var(--bad)}.c-transit{background:var(--warn)}.c-maint{background:var(--ink-3)}
.hb{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.hb .track{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--accent);border-radius:4px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select,.f input,.f select,.f textarea,.inl{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0;width:100%}
.filters input,.filters select{width:auto}
.filters input[type=search]{flex:1 1 220px;max-width:340px}
.filters label.ck,label.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.filters input[type=checkbox],.ck input{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:600;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.linkbtn.mono{font-weight:500}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.tbl th{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--surface-2)}
.tbl th.num,.tbl td.num{text-align:right}
.tbl .two{display:flex;flex-direction:column;gap:1px;min-width:0}
.tbl .two small{color:var(--ink-3);font-size:12px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.count{font-size:12.5px;color:var(--ink-3)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.dl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 16px;margin:0}
.dl dt{color:var(--ink-3);font-size:12.5px}
.dl dd{margin:0;overflow-wrap:anywhere}
.cust-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}

#drawer{position:fixed;inset:0;z-index:50;display:none}
#drawer.open{display:block}
#drawer .ov{position:absolute;inset:0;background:rgba(10,20,28,.5)}
#drawer .dr{position:absolute;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--bg);box-shadow:var(--shadow);overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
.dr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-top h2{margin:0;font-size:20px;letter-spacing:-.01em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.tl li:last-child{border-bottom:0}
.tl time{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12.5px}
.sum{display:flex;flex-direction:column;gap:4px;align-items:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.sum div{display:flex;gap:24px;justify-content:space-between;min-width:260px}
.sum .tot{font-weight:700;font-size:16px}

.gantt{position:relative;padding:22px 12px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.g-axis{position:absolute;left:12px;right:12px;top:4px;height:16px;font-size:11px;color:var(--ink-3)}
.g-axis span{position:absolute;white-space:nowrap}
.g-track{position:relative;height:26px;margin-top:2px}
.g-bar{position:absolute;top:2px;height:22px;border-radius:5px;font-size:11.5px;font-weight:600;padding:0 6px;line-height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid currentColor}
.g-today{position:absolute;top:18px;bottom:6px;width:2px;background:var(--bad);opacity:.8}

/* biểu mẫu */
.form{display:flex;flex-direction:column;gap:16px}
.fs{display:flex;flex-direction:column;gap:10px}
.fs>h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
.fg .w2{grid-column:span 2}
.fg .wall{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink)}
label.f textarea{resize:vertical}
label.f.rel{position:relative}
.stk{position:sticky;top:0;z-index:15;background:var(--bg);padding:10px 0 12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line)}
.scroll.clip{overflow-x:clip}
.tbl.stkth th{position:sticky;top:var(--stkh,0px);z-index:5}
tr.fr th:nth-child(3){width:150px}tr.fr th:nth-child(5){min-width:88px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bulk[hidden]{display:none}
.bulk select{font-size:12.5px;padding:5px 8px;height:auto}
.ivsel{font-size:12.5px;padding:5px 8px;height:auto;min-width:150px;border-radius:8px}
.ivsel{font-weight:600;min-width:140px}
.ivsel.iv-none{background:var(--surface);color:var(--ink-3);border:1px dashed var(--line)}
.ivsel.iv-issued{background:var(--info-bg);color:var(--info);border:1px solid var(--info)}
.ivsel.iv-sent{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.ivsel option{background:var(--surface);color:var(--ink)}
.tbl td input[type=checkbox],.tbl th input[type=checkbox]{width:17px;height:17px;margin:0;cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px}
.kv .it{min-width:0;display:flex;flex-direction:column;gap:2px}
.kv .it>span{font-size:11.5px;color:var(--ink-3);font-weight:500}
.kv .it>b{font-weight:600;overflow-wrap:anywhere;font-size:13.5px}
.kv .it .big{font-size:15px}
.kv .wide{grid-column:1/-1}
.kv-m{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.lc{margin:12px 16px 4px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.lc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lc-t{display:flex;align-items:baseline;gap:10px}
.lc-t b{font-size:16px}
.lc-s{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lc-n{margin-top:8px}
.panel>.lc:last-of-type{margin-bottom:12px}
.tbl.fit{table-layout:auto}.tbl.fit th,.tbl.fit td{white-space:normal}
@media(max-width:700px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rng{display:grid;grid-template-columns:auto auto;gap:3px 8px;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.35;justify-content:start;white-space:nowrap}
.rng .k{color:var(--ink-3);font-size:12px}
tr.fr th{padding:6px 8px;background:var(--surface);text-transform:none;letter-spacing:0;font-weight:400}
.tbl.stkth tr.fr th{top:calc(var(--stkh,0px) + var(--thh,40px))}
.tbl tr.fr input,.tbl tr.fr select{width:100%;min-width:0;font-size:12.5px;padding:5px 7px;height:auto}
@media(max-width:1180px){.scroll.clip{overflow-x:auto}}
@media(max-width:900px){.tbl.stkth tr.fr th{position:static}.stk{position:static;box-shadow:none}.scroll.clip{overflow-x:auto}.tbl.stkth{min-width:900px}.tbl.stkth th{position:static}}
.fg.fg5{grid-template-columns:repeat(5,minmax(0,1fr))}
.fg.fg5 .wall{grid-column:1/-1}
@media(max-width:760px){.fg.fg5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cdd{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:240px;overflow:auto;display:none}
.cdd.on{display:block}
.cdd .cdi{padding:9px 12px;cursor:pointer;font-weight:400;color:var(--ink)}
.cdd .cdi:hover{background:var(--line)}
.cdd .cde{padding:9px 12px;font-weight:400;color:var(--ink-2)}
.ln{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.ln-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.calc{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.calc b{color:var(--ink)}
.fbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:calc(-28px - env(safe-area-inset-bottom,0px));padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.fbar .grow{flex:1;min-width:0;align-self:center;font-size:13px}
.cinfo{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-2);padding:8px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.ferr{padding:10px 14px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px;font-weight:500}

const LOADED_AT=(()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`})();
const EN_DICT=[['XUẤT NHẬP KHẨU','IMPORT EXPORT'],['MỘT THÀNH VIÊN','ONE MEMBER'],['CAO SU','RUBBER'],['ĐẦU TƯ','INVESTMENT'],['XÂY DỰNG','CONSTRUCTION'],['THƯƠNG MẠI','TRADING'],['DỊCH VỤ','SERVICE'],['SẢN XUẤT','MANUFACTURING'],['CÔNG NGHIỆP','INDUSTRIAL'],['KỸ THUẬT','ENGINEERING'],['DU LỊCH','TRAVEL'],['VẬN TẢI','TRANSPORT'],['CƠ KHÍ','MECHANICAL'],['CÔNG NGHỆ','TECHNOLOGY'],['GIẢI PHÁP','SOLUTIONS'],['TƯ VẤN','CONSULTING'],['PHÁT TRIỂN','DEVELOPMENT'],['VIỆT NAM','VIETNAM'],['HÀ NỘI','HANOI'],['HỒ CHÍ MINH','HO CHI MINH'],['CHI NHÁNH','BRANCH'],['VĂN PHÒNG ĐẠI DIỆN','REPRESENTATIVE OFFICE'],['QUỐC TẾ','INTERNATIONAL'],['ĐIỆN TỬ','ELECTRONICS'],['ĐIỆN','ELECTRIC'],['THỰC PHẨM','FOOD'],['GIÁO DỤC','EDUCATION'],['NHẬT BẢN','JAPAN'],['HÀN QUỐC','KOREA'],['TỔNG HỢP','GENERAL'],['VÀ','AND']];
function toEn(s){
  let t=String(s||'').toUpperCase().replace(/\s+/g,' ').trim();if(!t)return '';
  let suf='';
  const pre=[[/^CÔNG TY TNHH MTV\s+/,'CO., LTD'],[/^CÔNG TY TNHH MỘT THÀNH VIÊN\s+/,'CO., LTD'],[/^CÔNG TY TNHH\s+/,'CO., LTD'],[/^CÔNG TY CỔ PHẦN\s+/,'JOINT STOCK COMPANY'],[/^CÔNG TY CP\s+/,'JOINT STOCK COMPANY'],[/^CÔNG TY\s+/,'COMPANY'],[/^DOANH NGHIỆP TƯ NHÂN\s+/,'PRIVATE ENTERPRISE'],[/^CHI NHÁNH CÔNG TY\s+/,'COMPANY BRANCH']];
  for(const [re,v] of pre){if(re.test(t)){t=t.replace(re,'');suf=v;break}}
  EN_DICT.forEach(([vi,en])=>{t=t.replace(new RegExp('(^| )'+vi+'(?= |$)','g'),'$1'+en)});
  t=t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/Đ/g,'D').replace(/đ/g,'d').replace(/\s+/g,' ').trim();
  return (t+(suf?(/[A-Z]$/.test(t)&&suf.charAt(0)!==','?' ':'')+suf:'')).trim();
}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=iso(new Date());
const P=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const dayDiff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const addDays=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=P(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const fmtD=s=>s?s.split('-').reverse().join('/'):'—';
const fmtS=s=>s?s.split('-').reverse().slice(0,2).join('/'):'—';
const vnd=n=>{const v=Math.round(n||0);return (v<0?'-':'')+String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')};
const vndS=n=>Math.abs(n)>=1e6?(n/1e6).toFixed(1).replace('.',',')+' tr':vnd(n);

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const safeId=s=>String(s).trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,'-').slice(0,120);
const gp=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const sp=(o,p,v)=>{const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* Số tiền bằng chữ (tiếng Việt) */
function vnWords(n){
  n=Math.round(n||0);if(n===0)return 'Không đồng';
  const d=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const three=(x,full)=>{
    const tr=Math.floor(x/100),ch=Math.floor(x%100/10),dv=x%10;let s='';
    if(tr>0||full)s=d[tr]+' trăm';
    if(ch>1){s+=(s?' ':'')+d[ch]+' mươi';if(dv===1)s+=' mốt';else if(dv===4)s+=' tư';else if(dv===5)s+=' lăm';else if(dv>0)s+=' '+d[dv]}
    else if(ch===1){s+=(s?' ':'')+'mười';if(dv===5)s+=' lăm';else if(dv>0)s+=' '+d[dv]}
    else if(dv>0){s+=(tr>0||full)?' lẻ '+d[dv]:d[dv]}
    return s.trim();
  };
  const neg=n<0;n=Math.abs(n);
  const groups=[];while(n>0){groups.push(n%1000);n=Math.floor(n/1000)}
  const units=['',' nghìn',' triệu',' tỷ',' nghìn tỷ',' triệu tỷ'];
  const parts=[];
  for(let i=groups.length-1;i>=0;i--){
    if(groups[i]===0)continue;
    parts.push(three(groups[i],i<groups.length-1)+units[i]);
  }
  let r=parts.join(' ');
  r=r.charAt(0).toUpperCase()+r.slice(1);
  return (neg?'Âm ':'')+r+' đồng chẵn';
}

function calc(l){
  const R=RUL();const qn=Math.max(1,Math.round(+l.qty||1));let base=l.fixed!=null?l.fixed:l.price*l.days*qn;
  l.act=0;l.settle='';
  const phys=l.dev&&l.dev!=='eSim'&&l.prod!=='eSIM';
  if(l.fixed==null&&phys&&!l.months&&l.useDays!=null&&l.useDays!==''&&l.days>0){
    const reg=l.days,u=Math.max(0,Math.min(+l.useDays||0,reg));
    if(u*100>=reg*R.minPct){base=l.price*u*qn;l.settle='full'}
    else if(u>0){base=l.price*u*qn;l.act=R.actFee;l.settle='part'}
    else{base=0;l.act=R.actFee*reg;l.settle='none'}
  }
  l.base=base;
  l.disc=(l.fixed!=null||l.settle==='none')?0:Math.round(base*l.dpct/100);
  l.ex=l.fixed!=null?l.fixed:base-l.disc+l.act+l.fee+l.ins+l.comp+(+l.holdFee||0);
  l.vatAmt=Math.round(l.ex*l.vat/100);
  l.total=l.ex+l.vatAmt;
}

    i.late=i.recv?Math.max(0,dayDiff(i.due,i.recv)):Math.max(0,dayDiff(i.due,TODAY));

}

const NEAR_HN=['bac ninh','bac giang','hung yen','hai duong','hai phong','vinh phuc','phu tho','thai nguyen','ha nam','hoa binh','nam dinh','ninh binh','thai binh','quang ninh'];
function zoneOf(addr,area,note){
  const t=nrm((note||'')+' '+(addr||''));
  if(/ha noi|hanoi/.test(t))return 'HN';
  if(/ho chi minh|hcm|sai gon|saigon/.test(t))return 'HCM';
  if(NEAR_HN.some(p=>t.indexOf(p)>=0))return 'NEAR';
  if(area==='HN'||area==='HCM')return area;
  return 'FAR';
}
const ZONE_LBL={HN:'Hà Nội',HCM:'TP.HCM',NEAR:'tỉnh lân cận Hà Nội',FAR:'khu vực khác'};
/* trả về {days,dl,time,rule,zone} hoặc null nếu đơn vị giao không có quy định */
/* lùi n ngày làm việc (T2 đến T6), bỏ qua thứ bảy và chủ nhật */
function subWorkDays(d,n){let x=d;while(n>0){x=addDays(x,-1);const w=new Date(x+'T00:00:00').getDay();if(w!==0&&w!==6)n--}return x}
function leadRule(firm,addr,area,note,start){
  const zone=zoneOf(addr,area,note);let days=0,time='',rule='';
  if(firm==='Grab'){days=1.5;time='12:00';rule='Grab: giao trước 1,5 ngày'}
  else if(firm==='Chuyển phát khác'){days=(zone==='FAR')?5:3;rule='Chuyển phát: hẹn lịch trước '+days+' ngày ('+ZONE_LBL[zone]+')'}
  else return null;
  const back=Math.ceil(days);
  let earliest=TODAY;for(let k=0;k<60;k++){if(subWorkDays(earliest,back)>=TODAY)break;earliest=addDays(earliest,1)}
  return{days,time,rule:rule+', tính ngày làm việc T2–T6',zone,dl:start?subWorkDays(start,back):'',earliest};
}
function lineLead(l){
  if(!isPhys(l)||!l.o)return null;const c=CB[l.cus]||{};
  return leadRule(l.o.firm,c.addr,l.o.area,l.o.areaNote,l.s);

function plBuild(id){
  const D=PLDATA[id],out=[],seen={},reg={};
  BASE_PRICES.concat(ESIM_BASE).forEach(p=>{if(p.c&&!reg[p.c]){const r=p.region||String(p.note||'').split(' · ')[0];if(REGIONS.indexOf(r)>=0)reg[p.c]=r}});
  const rg=c=>reg[c]||(PLNEWC[c]?'Đa quốc gia':'');
  const add=o=>{const k=o.kind+'|'+o.c+'|'+o.pkg;if(seen[k]){seen[k]++;o.pkg+=' · phương án '+seen[k]}else seen[k]=1;
    o.id='pl_'+id+'_'+out.length;o.pl=id;o.active=true;o.region=rg(o.c);o.note='';o.src='';o.cover='';o.priceVat=Math.round(o.price*1.1);out.push(o)};

  /* eSIM: không có giá riêng, dùng bảng giá thường */
  return out.concat(stdPrices().filter(p=>p.kind==='eSIM'));
}

const custPL=cid=>{const c=cid&&cid!=='__new'?CB[cid]:null;if(!c)return '';const v=c.plist!=null?c.plist:plAuto(c);return PLDATA[v]&&plAuto(c)===v?v:''};

function findPrice(prod,c,unit,pkg){const L=prices().filter(p=>p.active!==false&&p.kind===prod&&p.c===c&&p.unit===unit);if(!pkg)return L[0];return L.find(p=>p.pkg===pkg)||L.find(p=>!p.pkg)}
function pkgOptions(prod,c,cur,unit){if(prod==='eSIM'){const L=prices().filter(p=>p.active!==false&&p.kind==='eSIM'&&p.c===c&&p.pkg);const seen={};const o=[];L.sort((a,b)=>(a.ptype===b.ptype?0:a.ptype==='d'?-1:1)||(String(a.amt).replace(/\D/g,'')*(/GB/.test(a.amt)?1000:1)-String(b.amt).replace(/\D/g,'')*(/GB/.test(b.amt)?1000:1))||((+a.days||0)-(+b.days||0))).forEach(p=>{if(!seen[p.pkg]){seen[p.pkg]=1;o.push(p.pkg)}});if(cur&&o.length&&o.indexOf(cur)<0)o.push(cur);return o}const o=prices().filter(p=>p.active!==false&&p.kind===prod&&p.c===c&&p.pkg&&(!unit||p.unit===unit)).map(p=>p.pkg).filter((v,i,a)=>a.indexOf(v)===i);return o.sort((x,y)=>PKG_ORD(x)-PKG_ORD(y))}

function downloadBlob(filename,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
}

async function save(col,id,data){
  (LIVE[col]=LIVE[col]||{})[id]=data;persistLive();rebuild();renderSoft();
  if (GAS_WEB_APP_URL) {
    try {
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ collection: col, id: id, data: data })
      });
    } catch (e) { console.warn(e); }
  }
}
async function remove(col,id){

function nextNo(prefix,col){
  const ym=TODAY.slice(0,4)+TODAY.slice(5,7);
  const n=Object.values(LV(col)).filter(d=>d.no&&d.no.indexOf(prefix+'-'+ym)===0).length+1;
  let no=prefix+'-'+ym+'-'+String(n).padStart(3,'0');
  const used=new Set(Object.values(LV(col)).map(d=>d.no));let k=n;while(used.has(no)){k++;no=prefix+'-'+ym+'-'+String(k).padStart(3,'0')}

}
async function initData(){

    setDbState('connecting');

      const response = await fetch(GAS_WEB_APP_URL);
      const serverData = await response.json();

        COLS.forEach(c => {
          if (serverData[c]) Object.assign(LIVE[c] = LIVE[c] || {}, serverData[c]);
        });
        persistLive(); setDbState('on'); rebuild(); renderSoft();
      } else { setDbState('on'); }
    } catch (e) { setDbState('on'); }
  } else { setDbState('on'); }
}

function dispatchData(A){
  if(A===undefined)A=S.dispArea;
  const lim=addDays(TODAY,7),near=addDays(TODAY,2);
  const okA=x=>!A||x.area===A||(x.loc&&x.loc===A);
  const dlOf=l=>{const r=lineLead(l);return r&&r.dl?r.dl:l.s};
  const deliver=LINES.filter(l=>l.st==='pending'&&dlOf(l)<=lim&&okA(l)).sort((a,b)=>dlOf(a)<dlOf(b)?-1:dlOf(a)>dlOf(b)?1:0);
  const collect=LINES.filter(l=>l.st==='using'&&!l.hold&&!l.renew&&isPhys(l)&&l.e<=near&&okA(l)).sort((a,b)=>a.e<b.e?-1:1);
  const stock=devList().filter(d=>d.k==='transit'&&okA(d));
  return{deliver,collect,stock,total:deliver.length+collect.length+stock.length};
}

VIEWS.customers=function(){
  return head('Khách hàng','Bấm vào một khách để xem lịch sử đơn, nguồn, doanh thu và dư nợ.',`<div class="btns">${expBtn('customers')}${newBtn('newcust','Thêm khách hàng')}</div>`)+
  `<div class="filters"><input type="search" id="cq" placeholder="Tìm mã khách, tên, MST" value="${esc(S.f.customers.q)}" aria-label="Tìm khách"></div>
   <div class="panel"><div class="scroll"><table class="tbl" style="min-width:900px"><thead><tr><th>Mã khách hàng</th><th>Nguồn</th><th class="num">Giảm giá</th><th class="num">Số đơn</th><th class="num">Doanh thu chưa VAT</th><th class="num">Dư nợ</th><th class="num">Máy đang giữ</th><th>Thuê gần nhất</th><th></th></tr></thead><tbody id="ctb"></tbody></table></div></div>`;
};
function drawCustomers(){
  const q=S.f.customers.q.trim().toLowerCase();
  const rows=CUS.map(c=>({c,s:custStats(c.id)})).filter(x=>!q||(x.c.name+x.c.legal+(x.c.en||'')+x.c.mst).toLowerCase().includes(q)).sort((a,b)=>b.s.ex-a.s.ex);
  LAST.customers=rows;
  $('ctb').innerHTML=rows.map(({c,s})=>`<tr class="row" tabindex="0" data-act="cust" data-id="${esc(c.id)}"><td><div class="two"><b>${esc(c.name)}</b><small>${esc(c.legal)}${c.mst?' · '+esc(c.mst):''}</small></div></td><td><small>${esc(c.src)}</small></td>
   <td class="num">${custPct(c)?custPct(c)+'%':'<span class="muted">—</span>'}</td><td class="num">${s.os.length}</td><td class="num">${vnd(s.ex)}</td><td class="num">${s.out?`<b style="color:var(--${s.over?'bad':'warn'})">${vnd(s.out)}</b>`:'<span class="muted">0</span>'}</td><td class="num">${s.held.length||'<span class="muted">0</span>'}</td><td>${fmtD(s.last)}</td><td style="white-space:nowrap"><button class="btn sm" data-act="editcust" data-id="${esc(c.id)}">Sửa</button> <button class="btn sm danger" data-act="delcust" data-id="${esc(c.id)}">Xóa</button></td></tr>`).join('')||`<tr><td colspan="9" class="empty">Không tìm thấy khách</td></tr>`;
}
function contractList(id,editable){
  const cs=custContracts(id);
  if(!cs.length)return '<div class="muted">Chưa có hợp đồng nào được gắn.</div>';
  return `<div class="scroll"><table class="tbl" style="min-width:560px"><thead><tr><th>Số hợp đồng</th><th>Loại</th><th>Ngày ký</th><th>Hiệu lực đến</th><th>File</th>${editable?'<th></th>':''}</tr></thead><tbody>${cs.map(c=>`<tr><td><b>${esc(c.no||'—')}</b>${c.note?`<br><small class="muted">${esc(c.note)}</small>`:''}</td><td>${esc(c.type||'')}</td><td>${fmtD(c.signed)}</td><td>${c.expires?fmtD(c.expires)+(c.expires<TODAY?' '+chip('bad','Hết hạn'):''):'Không thời hạn'}</td>
   <td>${c.asset?`<a href="/_blob/${esc(c.asset)}" target="_blank" rel="noopener">${esc(c.fname||'Mở file')}</a>`:'<span class="muted">Chưa đính kèm</span>'}</td>${editable?`<td><button class="btn sm danger" data-act="delcontract" data-id="${esc(c.id)}">Xóa</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
VIEWS.customer=function(){
  const c=CB[S.cust],s=custStats(c.id);
  const tabs=[['orders','Lịch sử đơn'],['invoices','Hóa đơn và công nợ'],['devices','Thiết bị đang giữ'],['info','Liên hệ và hợp đồng']];
  let body='';
  if(S.tab==='orders'){
    body=`<div class="scroll"><table class="tbl" style="min-width:760px"><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th class="num">Dòng</th><th>Thời gian thuê</th><th>Nguồn đơn</th><th class="num">Chưa VAT</th><th>Trạng thái</th><th>Thanh toán</th></tr></thead><tbody>${
    s.os.slice().sort((a,b)=>a.date<b.date?1:-1).map(o=>{const os=orderState(o),ps=payState(o);const st=o.lines.reduce((m,l)=>!m||l.s<m?l.s:m,''),en=o.lines.reduce((m,l)=>l.e>m?l.e:m,'');
     return `<tr class="row" tabindex="0" data-act="order" data-id="${esc(o.code)}"><td class="mono">${esc(o.code)}${demoTag(o)}</td><td>${fmtD(o.date)}</td><td class="num">${o.lines.length}</td><td>${fmtD(st)} – ${fmtD(en)}</td><td><small>${esc(c.src)}</small></td><td class="num">${vnd(orderEx(o))}</td><td>${chip(os.tone,os.label)}</td><td>${chip(ps.tone,ps.label)}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Khách chưa có đơn</td></tr>'}</tbody></table></div>`;
  }else if(S.tab==='invoices'){
    body=s.invs.length?`<div class="scroll"><table class="tbl" style="min-width:780px"><thead><tr><th>Số HĐ</th><th>Ngày HĐ</th><th>Hạn thu</th><th class="num">Giá trị</th><th>Ngày nhận</th><th class="num">Dư nợ</th><th>Tuổi nợ</th></tr></thead><tbody>${
     s.invs.slice().sort((a,b)=>a.date<b.date?1:-1).map(i=>`<tr><td><b>${i.no}</b></td><td>${fmtD(i.date)}</td><td>${fmtD(i.due)}</td><td class="num">${vnd(i.total)}</td><td>${i.recv?fmtD(i.recv):'—'}</td><td class="num">${i.out?`<b>${vnd(i.out)}</b>`:'0'}</td>
     <td>${i.recv?chip('ok','Đã thu'+(i.late?`, trễ ${i.late} ngày`:'')):chip(i.age===0?'warn':'bad',AGE[i.age])}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có hóa đơn</div>';
  }else if(S.tab==='devices'){
    body=s.held.length?`<div class="scroll"><table class="tbl" style="min-width:640px"><thead><tr><th>Máy</th><th>Trạng thái</th><th>Đơn</th><th>Ngày giao</th><th>Hạn thu</th></tr></thead><tbody>${
     s.held.map(d=>`<tr><td>${dlink(d.code)}</td><td>${dchip(d)}${d.late?`<br><small class="muted">trễ ${d.late} ngày</small>`:''}</td><td>${olink(d.cur.o.code)}</td><td>${fmtD(d.cur.del||d.cur.s)}</td><td>${d.k==='hold'?'Khách giữ máy':fmtD(d.cur.e)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Khách không giữ máy nào</div>';
  }else{
    body=`<div class="pb"><div class="btns" style="margin-bottom:12px"><button class="btn" data-act="editcust" data-id="${esc(c.id)}">Sửa thông tin</button><button class="btn" data-act="editdiscount" data-id="${esc(c.id)}">Sửa giảm giá</button><button class="btn" data-act="newcontract" data-id="${esc(c.id)}">${ico('plus')}Gắn hợp đồng</button></div>
     <dl class="dl"><dt>Tên pháp lý</dt><dd>${esc(c.legal)}</dd><dt>Tên tiếng Anh</dt><dd>${esc(c.en||'—')}</dd><dt>MST / số định danh</dt><dd class="mono">${esc(c.mst||'—')}</dd>
     <dt>Người liên hệ</dt><dd>${esc(c.contact||'—')}</dd><dt>Số điện thoại</dt><dd>${esc(c.phone||'—')}</dd><dt>Email</dt><dd>${esc(c.email||'—')}</dd><dt>Địa chỉ</dt><dd>${esc(c.addr||'—')}</dd>
     <dt>Giảm giá</dt><dd>${c.pct?`<b>${c.pct}%</b>${c.pctFrom||c.pctTo?` · hiệu lực ${c.pctFrom?fmtD(c.pctFrom):'từ trước'} đến ${c.pctTo?fmtD(c.pctTo):'không thời hạn'}`:''}${custPct(c)?'':' '+chip('warn','Chưa hoặc hết hiệu lực')}${c.pctNote?`<br><small class="muted">${esc(c.pctNote)}</small>`:''}`:'Không có'}</dd>
     <dt>Đặc điểm thanh toán</dt><dd>${esc(c.pay||'—')}</dd><dt>Hạn thanh toán</dt><dd>${c.terms||30} ngày kể từ ngày hóa đơn</dd></dl>
     <h3 style="margin:18px 0 8px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)">Hồ sơ cần để thanh toán</h3>${c.payDocs?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${docLabels(c).map(x=>chip('info',x)).join('')||'<span class="muted">Không yêu cầu chứng từ riêng.</span>'}</div><dl class="dl"><dt>Hình thức gửi</dt><dd>${esc(c.payVia||'—')}</dd><dt>Người hoặc email nhận</dt><dd>${esc(c.payTo||'—')}</dd><dt>Lưu ý</dt><dd>${esc(c.payNote||'—')}</dd></dl>`:`<div class="muted">Chưa thiết lập. Bấm "Sửa thông tin" để chọn các chứng từ khách yêu cầu.</div>`}
     <h3 style="margin:18px 0 8px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)">Hợp đồng đã ký</h3>${contractList(c.id,true)}</div>`;
  }
  return `<div><button class="back" data-act="nav" data-id="customers">‹ Khách hàng</button>
   <div class="cust-head"><h1 style="margin:0;font-size:22px;letter-spacing:-.015em">${esc(c.name)}</h1>${chip('acc',c.src)}${s.held.length?chip('info','Đang giữ '+s.held.length+' máy'):''}${c.pct?chip('ok','Giảm '+c.pct+'%'):''}</div><div class="muted" style="margin-top:2px">${esc(c.legal)}${c.mst?' · MST '+esc(c.mst):''}</div></div>
  <div class="btns"><button class="btn pri" data-act="neworder" data-id="${esc(c.id)}">${ico('plus')}Tạo đơn</button><button class="btn" data-act="newquote" data-id="${esc(c.id)}">Tạo báo giá</button><button class="btn" data-act="newstmt" data-id="${esc(c.id)}">Lập bảng kê</button><button class="btn" data-act="newpayreq" data-id="cus:${esc(c.id)}">Đề nghị thanh toán</button><button class="btn" data-act="editcust" data-id="${esc(c.id)}">Sửa khách</button><button class="btn danger" data-act="delcust" data-id="${esc(c.id)}">Xóa khách</button></div>
  <div class="grid3"><div class="kpi"><span class="l">Doanh thu chưa VAT</span><span class="v">${vnd(s.ex)}</span><span class="s">${vnd(s.inc)} đ gồm VAT</span></div>
   <div class="kpi"><span class="l">Số đơn</span><span class="v">${s.os.length}</span><span class="s">${s.ls.length} dòng thuê</span></div>
   <div class="kpi"><span class="l">Dư nợ</span><span class="v" style="color:var(--${s.out?(s.over?'bad':'warn'):'ink'})">${vnd(s.out)}</span><span class="s">${s.over?'có '+vnd(s.over)+' đ quá hạn':s.out?'chưa đến hạn':'không còn nợ'}</span></div>
   <div class="kpi"><span class="l">Thu tiền sau hóa đơn</span><span class="v">${s.avg==null?'—':s.avg+' ngày'}</span><span class="s">trung bình các hóa đơn đã thu</span></div>
   <div class="kpi"><span class="l">Nguồn khách</span><span class="v" style="font-size:16px;line-height:1.5">${esc(c.src)}</span><span class="s">Thuê gần nhất ${fmtD(s.last)}</span></div></div>
  <div class="panel"><div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button role="tab" aria-selected="${S.tab===k}" data-act="tab" data-id="${k}">${t}</button>`).join('')}</div>${body}</div>`;
};

/* ============ THIẾT BỊ ============ */
VIEWS.devices=function(){
  const f=S.f.devices;
  return head('Thiết bị','Vị trí, bên đang giữ và lịch thuê của từng máy.',`<div class="btns">${expBtn('devices')}${newBtn('newdevice','Thêm thiết bị')}</div>`)+
  `<div class="filters"><input type="search" id="dq" placeholder="Tìm mã máy, IMEI, khách" value="${esc(f.q)}" aria-label="Tìm thiết bị">
   <select id="ds" aria-label="Trạng thái"><option value="">Mọi trạng thái</option>${Object.keys(DK).map(k=>`<option value="${k}">${DK[k][0]}</option>`).join('')}</select>
   <select id="dl" aria-label="Vị trí"><option value="">HN, HCM, Other</option><option>HN</option><option>HCM</option><option>Other</option></select>
   <select id="dh" aria-label="Bên giữ"><option value="">Mọi bên giữ</option><option value="kho">Kho công ty</option><option value="cus">Khách hàng</option><option>Regus</option><option>Grab</option></select></div>
   <div class="panel"><div class="scroll"><table class="tbl" style="min-width:960px"><thead><tr><th>Mã máy</th><th>Loại</th><th>Trạng thái</th><th>Vị trí</th><th>Bên giữ</th><th>Đơn hiện tại</th><th>Ngày giao</th><th>Ngày thu</th><th></th></tr></thead><tbody id="dtb"></tbody></table></div><div class="count" style="padding:10px 12px" id="dc"></div></div>`;
};
function drawDevices(){
  const f=S.f.devices;$('ds').value=f.state;$('dl').value=f.loc;$('dh').value=f.holder;
  const q=f.q.trim().toLowerCase();
  const all=devList();
  const rows=all.filter(d=>{
    if(q&&!(d.code+' '+d.m.imei+' '+d.holder).toLowerCase().includes(q))return false;
    if(f.state&&d.k!==f.state)return false;if(f.loc&&d.loc!==f.loc)return false;if(f.holder&&holderKey(d)!==f.holder)return false;return true})
    .sort((a,b)=>{const w={overdue:0,transit:1,hold:2,rented:3,ready:4,maint:5};return w[a.k]-w[b.k]||(a.code<b.code?-1:1)});
  LAST.devices=rows;
  $('dtb').innerHTML=rows.map(d=>{const l=d.cur;
    const del=l?fmtD(l.del||l.s):'—';
    let thu='—';if(l){thu=l.ret?`${fmtD(l.ret)}<br><small class="muted">thực tế</small>`:d.k==='hold'?'<span class="muted">Khách giữ máy</span>':`${fmtD(l.e)}<br><small class="muted">${d.k==='overdue'?`trễ ${d.late} ngày`:d.k==='rented'?'dự kiến':'kết thúc thuê'}</small>`}
    const note=(d.note||(d.m.base&&d.m.base.note))||'';
    return `<tr class="row" tabindex="0" data-act="dev" data-id="${esc(d.code)}"><td><span class="mono"><b>${esc(d.code)}</b></span>${d.m.demo?' <span class="tag">MẪU</span>':''}<br><small class="mono muted">${esc(d.m.imei)}</small></td><td>${esc(d.m.type)}</td><td>${dchip(d)}${note?`<br><small class="muted">${esc(note)}</small>`:''}</td>
    <td><b>${esc(d.loc)}</b></td><td>${esc(d.holder)}</td><td>${l?olink(l.o.code):'<span class="muted">—</span>'}</td><td>${del}</td><td>${thu}</td><td><button class="btn sm" data-act="devstatus" data-id="${esc(d.code)}">Cập nhật</button></td></tr>`}).join('')||`<tr><td colspan="9" class="empty">Không có thiết bị phù hợp</td></tr>`;
  $('dc').textContent=`${rows.length} / ${all.length} thiết bị`;
}
function devDrawer(code){
  if(!DEVS[code])return `<div class="dr-top"><h2>Không tìm thấy máy</h2><button class="xbtn" data-act="close" aria-label="Đóng">×</button></div>`;
  const d=devState(code);const m=d.m;
  const ls=d.lines;
  let g='<div class="empty">Máy chưa có lượt thuê</div>';
  if(ls.length){
    const mn=addDays(ls[0].s,-4);const mxRaw=ls.reduce((x,l)=>l.e>x?l.e:x,TODAY);const mx=addDays(mxRaw,4);const T=dayDiff(mn,mx)+1;
    const pos=s=>dayDiff(mn,s)/T*100;
    const ticks=[];let t=P(mn);t.setDate(1);t.setMonth(t.getMonth()+1);while(iso(t)<=mx){ticks.push(iso(t));t.setMonth(t.getMonth()+1)}
    g=`<div class="gantt"><div class="g-axis">${ticks.map(x=>`<span style="left:${pos(x)}%">${pad(P(x).getMonth()+1)}/${P(x).getFullYear()}</span>`).join('')}</div>
    <div class="g-today" style="left:calc(12px + (100% - 24px) * ${pos(TODAY)/100})"></div>
    ${ls.map(l=>{const st=lineState(l);const w=Math.max((dayDiff(l.s,l.e)+1)/T*100,1.5);const tone=st.k==='pending'?'info':st.k==='closed'?'mute':st.tone;
      return `<div class="g-track"><span class="g-bar t-${tone}" style="left:${pos(l.s)}%;width:${w}%" title="${esc(CB[l.cus].name)} ${fmtD(l.s)} – ${fmtD(l.e)}">${esc(CB[l.cus].name)}</span></div>`}).join('')}</div>
    <div class="sm muted" style="margin-top:6px">Đường đỏ là ngày ${fmtD(TODAY)}.${d.k==='hold'?' Máy đang được khách giữ liên tục, thanh kết thúc là hạn ghi trong đơn.':''}</div>`;
  }
  const ev=[];
  ls.forEach(l=>{if(l.st!=='pending')ev.push({d:l.del||l.s,t:`Giao cho ${CB[l.cus].name}`+(l.o.firm?` (${l.o.firm})`:''),o:l.o.code});
    if(l.ret)ev.push({d:l.ret,t:'Thu hồi'+(l.retFirm?` qua ${l.retFirm}`:''),o:l.o.code});
    else if(l.st!=='using'&&l.st!=='pending')ev.push({d:l.e,t:'Kết thúc thuê, chưa ghi ngày trả'+(l.retFirm?`, trả qua ${l.retFirm}`:''),o:l.o.code,warn:true})});
  ev.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  const l=d.cur;
  return `<div class="dr-top"><div><h2><span class="mono" style="font-size:19px">${esc(code)}</span>${m.demo?' <span class="tag">MẪU</span>':''} ${dchip(d)}</h2><div class="muted mono" style="margin-top:4px">IMEI ${esc(m.imei)} · ${esc(m.type)}</div></div><button class="xbtn" data-act="close" aria-label="Đóng">×</button></div>
  <div class="btns"><button class="btn pri" data-act="devstatus" data-id="${esc(code)}">Cập nhật trạng thái</button><button class="btn" data-act="editdev" data-id="${esc(code)}">Sửa thiết bị</button>${l&&l.st!=='pending'&&!l.ret?`<button class="btn" data-act="devstatus" data-id="${esc(code)}">Ghi nhận trả máy</button>`:''}</div>
  <div class="panel"><div class="pb"><dl class="dl"><dt>Vị trí hiện tại</dt><dd><b>${esc(d.loc)}</b>${(d.note||(m.base&&m.base.note))?` · ${esc(d.note||m.base.note)}`:''}</dd><dt>Bên đang giữ</dt><dd>${d.cusId?clink(d.cusId):esc(d.holder)}${d.k==='transit'?' <span class="muted">(suy ra từ đơn vị trả trong đơn)</span>':''}</dd>
   <dt>Đơn hiện tại</dt><dd>${l?olink(l.o.code):'—'}</dd><dt>Ngày giao máy</dt><dd>${l?fmtD(l.del||l.s):'—'}</dd>
   <dt>Ngày thu máy</dt><dd>${l?(l.ret?fmtD(l.ret)+' (thực tế)':d.k==='hold'?'Khách giữ máy':fmtD(l.e)+(d.k==='overdue'?` (trễ ${d.late} ngày)`:' (dự kiến)')):'—'}</dd>
   ${d.next?`<dt>Lượt thuê tiếp theo</dt><dd>${olink(d.next.o.code)} từ ${fmtD(d.next.s)}</dd>`:''}</dl></div></div>
  <div class="panel"><h2>Lịch thuê</h2><div class="pb">${g}</div></div>
  <div class="panel"><h2>Lịch sử di chuyển</h2><div class="pb">${ev.length?`<ul class="tl">${ev.map(e=>`<li><time>${fmtD(e.d)}</time><span${e.warn?' style="color:var(--warn)"':''}>${esc(e.t)}${e.o?` · ${olink(e.o)}`:''}</span></li>`).join('')}</ul>`:'<div class="empty">Chưa có lịch sử</div>'}</div></div>`;
}

/* ============ GIAO NHẬN ============ */
VIEWS.dispatch=function(){
  const D=dispatchData();const A=S.dispArea;
  const addr=l=>{const c=CB[l.cus];return [c.contact,c.phone,c.addr].filter(Boolean).join(' · ')||'Chưa có thông tin liên hệ'};
  const sect=(t,n,thead,rows)=>`<div class="panel"><h2>${t} <span class="muted" style="text-transform:none;letter-spacing:0">(${n})</span></h2><div class="scroll" style="padding-top:8px"><table class="tbl" style="min-width:820px"><thead><tr>${thead}</tr></thead><tbody>${rows||`<tr><td colspan="7" class="empty">Không có việc</td></tr>`}</tbody></table></div></div>`;

  const sr=D.stock.map(d=>`<tr><td>${dlink(d.code)}</td><td>${d.cur?clink(d.cur.cus):''}<br><small class="muted">${d.cur?olink(d.cur.o.code):''}</small></td><td><b>${esc(d.loc)}</b></td><td><b>${esc(d.holder)}</b><br><small class="muted">đơn vị nhận trả</small></td><td>${d.cur?fmtD(d.cur.ret||d.cur.e):'—'}<br><small class="muted">${d.cur&&d.cur.ret?'ngày trả':'ngày kết thúc thuê'}</small></td><td><button class="btn pri" data-act="stock" data-id="${esc(d.code)}">Nhập kho ${esc(d.loc)}</button></td></tr>`).join('');

   <div id="pbody"></div>`;
};
const kindLbl=x=>(KINDS.find(y=>y[0]===x)||[0,x])[1];
const otherRows=list=>list.map(p=>`<tr class="row" tabindex="0" data-act="editprice" data-id="${esc(p.id)}"><td><b>${esc(p.name)}</b></td><td>${esc(kindLbl(p.kind))}</td><td>${esc(CTRY[p.c]||'—')}</td><td>${esc(p.pkg||'—')}</td><td>${esc(p.unit)}</td><td class="num"><b>${vnd(p.price)}</b></td>${p.kind==='eSIM'?`<td>${esc(p.src||'—')}</td>`:''}<td><small class="muted">${esc(p.note||'')}</small></td><td>${p.active===false?chip('mute','Tạm ngưng'):chip('ok','Đang áp dụng')}</td></tr>`).join('');
const otherPanel=(list,es)=>list.length?`<div class="panel" style="margin-top:14px"><h2>Giá khác (không thuộc bảng trên)</h2><div class="scroll"><table class="tbl" style="min-width:700px"><thead><tr><th>Tên</th><th>Loại</th><th>Quốc gia</th><th>Gói</th><th>Đơn vị</th><th class="num">Đơn giá (chưa VAT)</th>${es?'<th>Nguồn SIM</th>':''}<th>Ghi chú</th><th>Áp dụng</th></tr></thead><tbody>${otherRows(list)}</tbody></table></div></div>`:'';
const plNote=pl=>{const has=CUS.some(c=>custPL(c.id)===pl);const n=CUS.filter(c=>custPL(c.id)===pl);
  return `<div class="note ${has?'info':'warn'}" style="margin-bottom:12px">${has?'Đang áp dụng cho: <b>'+n.map(c=>esc(cuLabel(c))).join(', ')+'</b>.':'Chưa có khách hàng nào dùng bảng giá này.'} ${has?'':`<button class="btn sm" data-act="mkplcus" data-id="${pl}" style="margin-left:6px">${ico('plus')}Thêm khách hàng ${esc(plName(pl))}</button>`}</div>`};
function drawPL(f){
  const pl=f.pl,es=false,rg=f.region||'',q=(f.q||'').trim().toLowerCase();
  const pr=$('pr');if(pr)pr.value=rg;
  const body=$('pbody');if(!body)return;
  const sd=stdPrices();const base=s=>String(s||'').replace(/ · phương án \d+$/,'');
  const vr=s=>{const m=/ · phương án (\d+)$/.exec(String(s||''));return m?+m[1]:1};
  const stdOf=p=>sd.find(x=>x.active!==false&&x.kind===p.kind&&x.c===p.c&&x.unit===p.unit&&x.pkg===base(p.pkg));
  const cell=p=>{if(!p)return '<td class="num muted">—</td>';const s=stdOf(p);const d=s&&s.price?Math.round((p.price/s.price-1)*100):null;
    return `<td class="num"><b>${vnd(p.price)}</b><br><small class="muted">${s?'thường '+vnd(s.price)+(d==null?'':' · '+(d>0?'+':'')+d+'%'):'thường: chưa có'}</small></td>`};
  if(es){body.innerHTML='<div class="panel"><div class="empty">'+esc(plName(pl))+' không có giá eSIM riêng. eSIM dùng bảng giá thường, giá tự điền khi tạo đơn hoặc báo giá.</div></div>';return}
  const all=prices(pl).filter(p=>(es?p.kind==='eSIM':p.kind!=='eSIM')&&(!rg||p.region===rg)&&(!q||((CTRY[p.c]||'')+' '+(p.pkg||'')).toLowerCase().includes(q)));
  const cn=c=>CTRY[c]||c;const srt=(a,b)=>cn(a.c).localeCompare(cn(b.c),'vi')||a.v-b.v;
  const amtN=a=>{const m=/^(\d+)(GB|MB)$/.exec(a);return m?+m[1]*(m[2]==='GB'?1000:1):0};
  const tbl=(title,sub,heads,rows,w)=>rows.length?`<div class="panel" style="margin-bottom:14px"><h2>${title}</h2>${sub?`<p class="muted" style="margin:0 0 8px">${sub}</p>`:''}<div class="scroll"><table class="tbl" style="min-width:${w}px"><thead><tr><th>Quốc gia</th>${heads.map(h=>`<th class="num">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`:'';
  const gridRows=(L,keys,pick)=>{const g={};L.forEach(p=>{const k=p.c+'|'+vr(p.pkg);(g[k]||(g[k]={c:p.c,v:vr(p.pkg),cells:{}})).cells[pick(p)]=p});
    return Object.values(g).sort(srt).map(r=>`<tr><td><b>${esc(cn(r.c))}</b>${r.v>1?` <small class="muted">phương án ${r.v}</small>`:''}</td>${keys.map(k=>cell(r.cells[k])).join('')}</tr>`)};
  let h='';
  if(!es){
    h=tbl('Cho thuê Wi-Fi (giá mỗi ngày)','',PKGS.map(p=>p.replace('/day','')+' mỗi ngày'),gridRows(all,PKGS,p=>p.pkg),620);
  }else{
    const daily=all.filter(p=>p.ptype==='d'&&+p.days===1),pk=all.filter(p=>p.ptype==='t');
    const am=[...new Set(daily.map(p=>p.amt))].sort((a,b)=>amtN(a)-amtN(b));
    h=tbl('eSIM thuê theo ngày (giá mỗi ngày)','Gói nhiều ngày = đơn giá mỗi ngày × số ngày; khi tạo đơn hoặc báo giá có sẵn các gói 1, 3, 5, 7, 10, 14, 15, 30 ngày.',am.map(a=>a+' / ngày'),gridRows(daily,am,p=>p.amt),620);
    const cols=[...new Set(pk.map(p=>base(p.pkg)))].sort((a,b)=>{const pa=pk.find(p=>base(p.pkg)===a),pb=pk.find(p=>base(p.pkg)===b);return amtN(pa.amt)-amtN(pb.amt)||pa.days-pb.days});
    h+=tbl('eSIM thuê theo gói (giá mỗi gói)','',cols,gridRows(pk,cols,p=>base(p.pkg)),Math.max(700,150+cols.length*110));
  }
  body.innerHTML=h||'<div class="panel"><div class="empty">Không có dòng giá nào khớp.</div></div>';
}
function drawPrices(){
  if(PLDATA[S.f.prices.pl])return drawPL(S.f.prices);
  const f=S.f.prices,es=f.tab==='esim',rg=f.region||'',q=(f.q||'').trim().toLowerCase();
  const sel=es?$('ps'):$('pk');if(sel)sel.value=es?(f.src||''):(f.kind||'');const pr=$('pr');if(pr)pr.value=rg;
  const all=prices().filter(p=>(es?p.kind==='eSIM':p.kind!=='eSIM')&&(es||!f.kind||p.kind===f.kind)&&(!es||!f.src||p.src===f.src)&&(!rg||p.region===rg)&&(!q||(p.name+' '+(CTRY[p.c]||'')+' '+(p.pkg||'')+' '+(p.note||'')+' '+(p.region||'')).toLowerCase().includes(q)));
  LAST.prices=all;
  const body=$('pbody');if(!body)return;
  if(!es){
    const isMat=p=>p.c&&PKGS.indexOf(p.pkg)>=0;
    const g={};all.filter(isMat).forEach(p=>{const key=p.kind+'|'+p.c+'|'+p.unit;const r=g[key]||(g[key]={kind:p.kind,c:p.c,unit:p.unit,region:'',cells:{}});if(!r.cells[p.pkg])r.cells[p.pkg]=p;if(!r.region&&p.region)r.region=p.region});
    const tr=Object.values(g).map(r=>`<tr><td><b>${esc(CTRY[r.c]||r.c)}</b></td><td>${r.region?chip('mute',r.region):'<span class="muted">—</span>'}</td><td>${esc(kindLbl(r.kind))}${r.unit!=='Ngày'?`<br><small class="muted">theo ${esc(r.unit.toLowerCase())}</small>`:''}</td>${PKGS.map(pk=>{const p=r.cells[pk];return p?`<td class="num"><button class="pcell${p.active===false?' off':''}" data-act="editprice" data-id="${esc(p.id)}" title="${p.active===false?'Tạm ngưng':'Sửa giá'}">${vnd(p.price)}</button></td>`:`<td class="num"><button class="pcell add" data-act="newprice" data-id="${esc([r.kind,r.c,r.unit,pk,r.region].join('|'))}" aria-label="Thêm giá ${esc(pk)}">+</button></td>`}).join('')}</tr>`).join('')||`<tr><td colspan="6" class="empty">Không có dòng giá nào khớp.</td></tr>`;
    body.innerHTML=`<div class="panel"><div class="scroll"><table class="tbl" style="min-width:760px"><thead><tr><th>Quốc gia</th><th>Khu vực</th><th>Loại</th>${PKGS.map(p=>`<th class="num">${p.replace('/day','')} mỗi ngày</th>`).join('')}</tr></thead><tbody>${tr}</tbody></table></div></div>`+otherPanel(all.filter(p=>!isMat(p)),false);
    return;
  }
  const isM=p=>p.c&&p.ptype&&p.amt&&p.days;
  const mat=all.filter(isM);
  const block=(pt,title,sub)=>{
    const L=mat.filter(p=>p.ptype===pt);if(!L.length)return '';
    const days=[...new Set(L.map(p=>+p.days))].sort((a,b)=>a-b);
    const g={};L.forEach(p=>{const key=p.c+'|'+p.amt+'|'+(p.src||'')+'|'+(p.cover||'')+'|'+(p.ip?1:0)+'|'+(p.v||1);const r=g[key]||(g[key]={c:p.c,amt:p.amt,src:p.src||'',cover:p.cover||'',ip:p.ip?1:0,v:p.v||1,region:p.region||'',cells:{}});r.cells[p.days]=p});

const isNS=o=>/nam\s*san/i.test((CB[o.cus]||{}).src||'');
const nsNet=(cid,dp)=>{const c=CB[cid]||{};dp=+dp||0;if(c.nsShare!=null&&c.nsShare!==''&&dp===(+c.pct||0))return +c.nsShare||0;return Math.max(0,30-dp)};
const nsRate=cid=>{const c=CB[cid]||{};return c.commPct!=null&&c.commPct!==''?(+c.commPct||0):30};
const commOf=o=>(LV('orderops')[o.code]||{}).comm||{};
/* một dòng: tổng tiền thuê = đơn giá × số ngày sử dụng thực tế × SL (chưa bảo hiểm, ship, VAT);
   giảm cho khách = % giảm giá của dòng; % hoa hồng thực nhận = % hoa hồng đại lý − % giảm (hoặc nhập tay) */
function commLine(o,l,i){const c=commOf(o),ov=(c.lines||{})[i]||{};const base=Math.round(l.base||0);const dp=+l.dpct||0;
  const q=ov.q!==''&&ov.q!=null?(+ov.q||0):(l.hq!==''&&l.hq!=null?(+l.hq||0):nsNet(o.cus,dp));
  const used=l.settle?(l.useDays||0):(l.days||0);
  return{base,dp,disc:Math.round(l.disc||0),q,net:Math.round(base*q/100),manual:(ov.q!==''&&ov.q!=null)||(l.hq!==''&&l.hq!=null),used}}
const isWifiL=l=>!(l.prod==='eSIM'||l.dev==='eSim'||l.type==='eSIM'||String(l.pkgType||l.iccid||'')!==''&&!l.dev);
const commOrder=o=>o.lines.reduce((t,l,i)=>{const k=commLine(o,l,i);t.base+=k.base;t.disc+=k.disc;t.net+=k.net;return t},{base:0,disc:0,net:0});

/* ---- xuất Excel chứng từ: dựng lại đúng bản in (chữ, bảng gộp ô, khối ký, ảnh) ---- */
async function htmlToXlsx(html,sheetName){
  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  const root=doc.querySelector('.paper')||doc.body;
  const land=/\bland\b/.test(root.className||'');
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet((sheetName||'Chứng từ').slice(0,31),{pageSetup:{orientation:land?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9},views:[{showGridLines:false}]});
  const FONT={name:'Arial',size:10};const thin={style:'thin',color:{argb:'FF9AA5AF'}};const BD={top:thin,left:thin,bottom:thin,right:thin};
  const BLK=new Set(['DIV','P','TABLE','UL','OL','H1','H2','H3','LI']);
  const tx=n=>(n.textContent||'').replace(/\s+/g,' ').trim();
  /* ---- lưới bảng ---- */
  const gridOf=t=>{const rows=[...t.querySelectorAll('tr')];const occ=[];const cells=[];let nc=0;
    rows.forEach((tr,ri)=>{occ[ri]=occ[ri]||[];let ci=0;[...tr.children].forEach(td=>{while(occ[ri][ci])ci++;const cs=Math.max(1,+td.getAttribute('colspan')||1),rsn=Math.max(1,+td.getAttribute('rowspan')||1);
      for(let a=0;a<rsn;a++)for(let b=0;b<cs;b++){occ[ri+a]=occ[ri+a]||[];occ[ri+a][ci+b]=true}
      cells.push({r:ri,c:ci,cs,rs:rsn,td,th:td.tagName==='TH',tr});ci+=cs;nc=Math.max(nc,ci)})});
    return{cells,nr:rows.length,nc}};
  const tables=[...root.querySelectorAll('table')].map(gridOf);
  let NC=Math.max(6,...tables.map(g=>g.nc));
  const W=Array(NC).fill(8);
  tables.forEach(g=>g.cells.forEach(c=>{if(c.cs===1&&!c.th){const L=Math.max(...String(c.td.innerText||c.td.textContent||'').split('\n').map(s=>s.trim().length),0);W[c.c]=Math.max(W[c.c],Math.min(L+2,44))}else if(c.cs===1)W[c.c]=Math.max(W[c.c],Math.min(Math.ceil(tx(c.td).length/2)+2,24))}));
  ws.columns=W.map(w=>({width:w}));
  const TW=W.reduce((a,b)=>a+b,0);
  const spanW=(a,b)=>{let s=0;for(let i=a;i<=b;i++)s+=W[i-1]||8;return s};
  let r=1;
  /* ---- chữ có định dạng ---- */
  const rich=el=>{const parts=[];const walk=(n,f)=>{n.childNodes.forEach(k=>{
      if(k.nodeType===3){const t=k.textContent.replace(/\s+/g,' ');if(t)parts.push({text:t,font:Object.assign({},FONT,f)});return}
      if(k.nodeType!==1)return;const tg=k.tagName;
      if(tg==='BR'){parts.push({text:'\n',font:Object.assign({},FONT,f)});return}
      const g=Object.assign({},f);if(tg==='B'||tg==='STRONG')g.bold=true;if(tg==='I'||tg==='EM')g.italic=true;
      if(k.classList&&k.classList.contains('en')){g.italic=true;g.color={argb:'FF4A5560'};if(tg==='SPAN'&&k.style.display==='block'&&parts.length&&!/\n$/.test(parts[parts.length-1].text)){parts.push({text:'\n',font:Object.assign({},FONT,f)})}}
      if(tg==='SMALL'){g.size=9;g.color={argb:'FF4A5560'}}
      walk(k,g)})};
    walk(el,{});
    /* gọn khoảng trắng đầu/cuối dòng */
    parts.forEach((p,i)=>{if(i===0||/\n$/.test(parts[i-1].text))p.text=p.text.replace(/^ +/,'')});
    while(parts.length&&/^\s*$/.test(parts[parts.length-1].text))parts.pop();
    if(parts.length)parts[parts.length-1].text=parts[parts.length-1].text.replace(/ +$/,'');
    return parts};
  const plain=parts=>parts.map(p=>p.text).join('');
  const lines=(s,w)=>String(s).split('\n').reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/Math.max(8,w*1.05))),0);
  const textRow=(el,o)=>{o=o||{};let parts=rich(el);if(!parts.length)return;
    if(o.bold)parts.forEach(p=>p.font=Object.assign({},p.font,{bold:true}));
    if(o.size)parts.forEach(p=>p.font=Object.assign({},p.font,{size:o.size}));
    if(o.prefix)parts.unshift({text:o.prefix,font:FONT});
    const a=o.a||1,b=o.b||NC;if(b>a)ws.mergeCells(r,a,r,b);const c=ws.getCell(r,a);c.value={richText:parts};
    c.alignment={horizontal:o.h||'left',vertical:'top',wrapText:true};
    const n=lines(plain(parts),spanW(a,b));const sz=o.size||10;ws.getRow(r).height=Math.max(ws.getRow(r).height||0,Math.max(15,n*(sz+4)+2));if(!o.keep)r++};
  const gap=(h)=>{ws.getRow(r).height=h||8;r++};
  /* ---- bảng ---- */
  const doTable=(t,gi)=>{const g=gi;const base=r;const CEN={horizontal:'center',vertical:'middle',wrapText:true};
    const extra=NC-g.nc;const rowH=Array(g.nr).fill(0);
    g.cells.forEach(c=>{const cs=c.cs+((c.c+c.cs===g.nc)?extra:0);const a=c.c+1,b=c.c+cs;const r1=base+c.r,r2=base+c.r+c.rs-1;
      if(b>a||r2>r1)ws.mergeCells(r1,a,r2,b);
      const td=c.td;const parts=rich(td);let text=plain(parts);const cls=td.className||'';
      const tot=c.tr.classList.contains('tot');const bold=c.th||tot;
      const cell=ws.getCell(r1,a);
      const num=/\br\b/.test(cls)&&/^-?\d{1,3}(\.\d{3})*$/.test(text.trim())?+text.trim().replace(/\./g,''):null;
      if(num!=null){cell.value=num;cell.numFmt='#,##0;-#,##0;"-"';cell.font=Object.assign({},FONT,{bold})}
      else if(parts.length){cell.value={richText:parts.map(p=>bold?Object.assign({},p,{font:Object.assign({},p.font,{bold:true})}):p)}}
      cell.alignment=c.th?CEN:(/\bc\b/.test(cls)?CEN:/\br\b/.test(cls)?{horizontal:'right',vertical:'middle',wrapText:true}:{horizontal:'left',vertical:'middle',wrapText:true});
      if(c.th)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF1F4'}};else if(tot)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF5F7F9'}};
      for(let y=r1;y<=r2;y++)for(let x=a;x<=b;x++){ws.getCell(y,x).border=BD;if(c.th)ws.getCell(y,x).fill=cell.fill}
      const need=Math.max(16,lines(text,spanW(a,b))*13+6);if(c.rs===1)rowH[c.r]=Math.max(rowH[c.r],need);else rowH[c.r]=Math.max(rowH[c.r],16)});
    g.cells.forEach(c=>{if(c.rs>1){const need=Math.max(16,lines(tx(c.td),spanW(c.c+1,c.c+c.cs))*13+6);const per=Math.ceil(need/c.rs);for(let k=0;k<c.rs;k++)rowH[c.r+k]=Math.max(rowH[c.r+k],per)}});
    rowH.forEach((h,i)=>{ws.getRow(base+i).height=Math.max(18,h)});
    r=base+g.nr;gap(8)};
  /* ---- ảnh ---- */
  const dim=src=>new Promise(res=>{const im=new Image();im.onload=()=>res([im.naturalWidth||600,im.naturalHeight||300]);im.onerror=()=>res([600,300]);im.src=src});
  const doImg=async el=>{const src=el.getAttribute('src')||'';const m=/^data:image\/(png|jpe?g|gif);base64,/i.exec(src);if(!m)return;
    const [w0,h0]=await dim(src);const maxW=Math.min(TW*7,760);const k=Math.min(1,maxW/w0,520/h0);const w=Math.round(w0*k),h=Math.round(h0*k);
    const id=wb.addImage({base64:src,extension:/jp/i.test(m[1])?'jpeg':m[1].toLowerCase()});ws.addImage(id,{tl:{col:0.1,row:r-1+0.1},ext:{width:w,height:h}});r+=Math.ceil(h/20)+1};
  /* ---- duyệt cây ---- */
  let ti=0;
  const walk=async el=>{for(const k of [...el.children]){
    const tg=k.tagName,cl=k.classList;
    if(tg==='TABLE'){const gi=tables[ti++];doTable(k,gi);continue}
    if(tg==='IMG'){await doImg(k);continue}
    if(tg==='H1'){textRow(k,{h:'center',bold:true,size:15});gap(6);continue}
    if(cl.contains('qh2')){textRow(k,{h:'center',size:11});continue}
    if(cl.contains('sub')){textRow(k,{h:'center'});gap(8);continue}
    if(cl.contains('sig')){const ds=[...k.children];const half=Math.floor(NC/2);const r0=r;
      ds.forEach((dv,i)=>{if(!tx(dv))return;textRow(dv,{a:i===0?1:half+1,b:i===0?half:NC,h:'center',keep:1})});
      ws.getRow(r0).height=Math.max(ws.getRow(r0).height||0,110);r=r0+1;gap(8);continue}
    if(cl.contains('kv2')){const ds=[...k.children];const lw=Math.min(3,NC-1);
      for(let i=0;i<ds.length;i+=2){const r0=r;textRow(ds[i],{a:1,b:lw,keep:1});if(ds[i+1])textRow(ds[i+1],{a:lw+1,b:NC,keep:1});r=r0+1}
      gap(6);continue}
    if(cl.contains('qtot')){const ds=[...k.children];const lw=Math.max(2,Math.floor(NC/2));
      const r0=r;textRow(ds[0],{a:Math.max(1,NC-lw-2),b:NC-2,h:'right',keep:1});if(ds[1])textRow(ds[1],{a:NC-1,b:NC,h:'right',keep:1});r=r0+1;gap(8);continue}
    if(tg==='UL'||tg==='OL'){[...k.children].forEach((li,i)=>{textRow(li,{prefix:tg==='UL'?'•  ':(i+1)+'. '})});gap(6);continue}
    if(cl.contains('sec')){gap(4);textRow(k,{bold:true});continue}
    if(cl.contains('lh')){textRow(k);gap(8);continue}
    if(cl.contains('ck')){textRow(k);continue}
    if(tg==='DIV'&&[...k.children].some(c=>BLK.has(c.tagName)||c.tagName==='IMG')){await walk(k);continue}
    if(tg==='P'||tg==='DIV'||tg==='LI'||tg==='H2'||tg==='H3'){
      if(tg==='H2'||tg==='H3')textRow(k,{bold:true,size:12});else textRow(k);
      if(tg==='P')gap(4);
      continue}
    }};
  await walk(root);
  const buf=await wb.xlsx.writeBuffer();return new Uint8Array(buf);
}
async function exportXlsx(sheets,filename){
  if(!window.XLSX){toast('Không tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.');return}
  try{
    const wb=XLSX.utils.book_new();
    sheets.forEach(sh=>{
      const ws=XLSX.utils.aoa_to_sheet(sh.rows);
      const w=[];sh.rows.forEach(r=>r.forEach((v,i)=>{const n=String(v==null?'':v).length;w[i]=Math.max(w[i]||8,Math.min(n+2,44))}));
      ws['!cols']=w.map(x=>({wch:x}));
      const ref=XLSX.utils.decode_range(ws['!ref']||'A1');
      for(let R=ref.s.r+(sh.fromRow||1);R<=ref.e.r;R++)for(let C=ref.s.c;C<=ref.e.c;C++){const c=ws[XLSX.utils.encode_cell({r:R,c:C})];if(c&&c.t==='n'&&!(sh.plain||[]).includes(C))c.z='#,##0'}
      XLSX.utils.book_append_sheet(wb,ws,sh.name.slice(0,31));
    });
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    downloadBlob(filename,new Uint8Array(out),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('Đã tạo file '+filename);
  }catch(e){
    if(e&&e.code==='declined')return;
    toast(e&&e.code==='rate_limited'?'Đang có hộp thoại lưu file khác, thử lại sau giây lát.':'Không xuất được file Excel.');
  }
}

async function renderPdfBlob(html){
  const land=/class="paper land"/.test(html);const W=land?1123:794,PH=land?794:1123,MT=30,MB=34,SC=2,PWpt=land?841.89:595.28,PHpt=land?595.28:841.89;
  const fr=document.createElement('iframe');fr.setAttribute('aria-hidden','true');
  fr.style.cssText='position:fixed;left:0;top:0;width:'+W+'px;height:'+PH+'px;border:0;opacity:0;pointer-events:none;z-index:-1';
  document.body.appendChild(fr);
  try{
    await new Promise(res=>{fr.onload=res;fr.srcdoc=html});
    const d=fr.contentDocument;
    const fix=d.createElement('style');fix.textContent='.paper{max-width:none!important;margin:0!important;padding:0 44px!important;width:'+W+'px;box-sizing:border-box}tr,.ck,.sig{break-inside:avoid}';d.head.appendChild(fix);
    await new Promise(r=>setTimeout(r,80));
    const paper=d.querySelector('.paper')||d.body;
    const top0=paper.getBoundingClientRect().top;
    const H=Math.ceil(paper.getBoundingClientRect().height)+36;
    const bs=getComputedStyle?d.defaultView.getComputedStyle(d.body):null;
    const cuts=[];
    paper.querySelectorAll('tr,.ck,.sig,.sec,p,h1,li,.qtot,.lh,.kv2,.qh2,.sub').forEach(e=>{const r=e.getBoundingClientRect();cuts.push({t:r.top-top0,b:r.bottom-top0})});
    const usable=PH-MT-MB;const pages=[];let start=0;
    while(start<H-1){
      const lim=start+usable;let end;
      if(lim>=H)end=H;
      else{
        let best=0;cuts.forEach(c=>{if(c.b<=lim+0.5&&c.b>start+160&&c.b>best)best=c.b});
        // không cắt ngang một khối đang vắt qua điểm cắt
        end=best||lim;
      }
      pages.push([start,Math.ceil(end)]);start=Math.ceil(end);
    }
    const css=[...d.querySelectorAll('style')].map(s=>s.textContent).join('\n').replace(/(^|[},\s])body\s*\{/g,'$1.pdfroot{').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const xml=new XMLSerializer().serializeToString(paper.cloneNode(true));
    const rootStyle='width:'+W+'px;background:#fff;color:'+bs.color+';font-family:'+bs.fontFamily.replace(/"/g,"'")+';font-size:'+bs.fontSize+';line-height:'+(parseFloat(bs.lineHeight)/parseFloat(bs.fontSize)||1.55).toFixed(4);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="'+W+'" height="'+H+'"><div xmlns="http://www.w3.org/1999/xhtml" class="pdfroot" style="'+rootStyle+'"><style>'+css+'</style>'+xml+'</div></foreignObject></svg>';
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
    const out=[];
    for(let i=0;i<pages.length;i++){
      const [a,b]=pages[i];const cv=document.createElement('canvas');cv.width=W*SC;cv.height=PH*SC;
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
      x.imageSmoothingQuality='high';
      x.drawImage(img,0,a,W,b-a,0,MT*SC,W*SC,(b-a)*SC);
      if(pages.length>1){x.fillStyle='#8A949E';x.font=(10*SC)+'px Arial,sans-serif';x.textAlign='right';x.fillText((i+1)+' / '+pages.length,(W-44)*SC,(PH-18)*SC)}
      const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',0.93));
      if(!blob)throw new Error('jpeg');
      out.push({w:cv.width,h:cv.height,bytes:new Uint8Array(await blob.arrayBuffer())});
    }
    return makePdf(out,PWpt,PHpt);
  }finally{fr.remove()}
}
function makePdf(pages,PW,PH){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);chunks.push(b);len+=b.length};
  const n=pages.length;
  push('%PDF-1.4\n');
  offs[1]=len;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2]=len;push('2 0 obj\n<< /Type /Pages /Count '+n+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>\nendobj\n');
  pages.forEach((p,i)=>{
    const pid=3+i*3,cid=pid+1,iid=pid+2;
    offs[pid]=len;push(pid+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\nendobj\n');
    const cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
    offs[cid]=len;push(cid+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    offs[iid]=len;push(iid+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bytes.length+' >>\nstream\n');
    push(p.bytes);push('\nendstream\nendobj\n');
  });
  const xr=len,total=3+n*3;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(chunks,{type:'application/pdf'});
}
async function savePdfFile(filename,html){
  toast('Đang tạo bản PDF…');

}

function devChoices(l,s,i){
  const want=l.prod==='Wifi device insert sim'?'Wi-Fi + SIM':'Wi-Fi';
  const out=[['','— Chọn máy —']];
  /* theo khu vực khách: HN chỉ máy HN; HCM gồm HN và HCM; Other ship từ HN */
  const locOk=s.area==='HCM'?['HN','HCM']:['HN'];
  const en=l.unit==='Tháng'&&l.s?addDays(addMonths(l.s,Math.max(1,+l.months||1)),-1):l.e;
  devList().filter(d=>d.m.type===want).sort((a,b)=>(a.loc===s.area?0:1)-(b.loc===s.area?0:1)||(a.code<b.code?-1:1)).forEach(d=>{
    const dup=s.lines.some((o,j)=>j!==i&&o.dev===d.code&&o.s&&o.e&&l.s&&en&&!(o.e<l.s||o.s>en));
    const a=devAvail(d.code,s.cus,l.s,en,s.edit);

}

function bulkInvoiceForm(codes){
  const os=codes.map(c=>ORD.find(x=>x.code===c)).filter(Boolean);
  const items=os.map(o=>({o,cand:o.lines.filter(l=>!l.inv)})).filter(x=>x.cand.length);
  const skipped=os.length-items.length;
  const s={no:'',date:TODAY,method:'Chưa thanh toán',mode:'each',err:[]};
  return {s,
    render(){const tot=sum(items,x=>sum(x.cand,l=>l.total));
      return `<div class="form">${formTop('Ghi hóa đơn hàng loạt',items.length+' đơn có dòng chưa xuất hóa đơn')}${ferr(s)}<div class="fg">${F('no','Số hóa đơn (đầu tiên)',{t:'num'})}${F('date','Ngày hóa đơn',{t:'date'})}${F('method','Phương thức thanh toán',{opts:['Chưa thanh toán','Chuyển khoản','Tiền mặt','Thẻ']})}${F('mode','Cách ghi',{opts:[['each','Mỗi đơn một hóa đơn (số tăng dần)'],['merge','Gộp một hóa đơn (cùng khách hàng)']],cls:'w2'})}</div>
      <div class="fs"><h3>Đơn đưa vào hóa đơn</h3>${items.map(x=>`<div class="sm" style="padding:3px 0"><span class="mono">${esc(x.o.code)}</span> · ${esc(CB[x.o.cus].name)} · ${x.cand.length} dòng · ${vnd(sum(x.cand,l=>l.total))} đ</div>`).join('')||'<div class="muted">Không có đơn nào đủ điều kiện</div>'}</div>
      ${skipped?`<div class="note info">${skipped} đơn bị bỏ qua vì đã xuất hóa đơn.</div>`:''}<div class="note info" style="margin-top:8px">Tổng giá trị: <b>${vnd(tot)} đ</b> (gồm VAT).</div>${fbar('','Ghi hóa đơn')}</div>`},
    onChange(){rerender()},
    async submit(){
      const err=[];const start=Math.round(+s.no||0);

      if(s.mode==='merge'&&new Set(items.map(x=>x.o.cus)).size>1)err.push('Gộp một hóa đơn chỉ dùng cho các đơn cùng một khách hàng.');
      const nos=s.mode==='merge'?[start]:items.map((x,i)=>start+i);
      nos.forEach(n=>{if(start>0&&INVMETA[n])err.push('Số hóa đơn '+n+' đã tồn tại.')});
      if(err.length){s.err=err;rerender();return}
      try{for(let i=0;i<nos.length;i++){await save('invoices',String(nos[i]),{no:nos[i],date:s.date,recv:null,method:s.method});
        const grp=s.mode==='merge'?items:[items[i]];for(const x of grp)for(const l of x.cand)await setLineOp(l,{inv:nos[i]})}}catch(e){return}
      S.f.orders.sel={};closeDrawer();toast('Đã ghi '+nos.length+' hóa đơn');if(S.view==='orders')drawOrders();
    }};
}

function arm(t,key,label){

/* ============ Ô chọn có lọc (combobox) ============ */
(function(){
  const nz=s=>String(s).normalize('NFC').split('').map(c=>c.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').toLowerCase()[0]||'').join('');
  const isM=n=>/nước|asean|châu|global|toàn cầu|world|,/i.test(n);
  let act=null,idx=-1;
  const close=()=>{if(act){act.l.hidden=true;act=null;idx=-1}};
  const hl=(name,toks)=>{const f=nz(name);let a=-1,b=-1;for(const t of toks){const i=f.indexOf(t);if(i>=0){a=i;b=i+t.length;break}}const e=esc;return a<0?e(name):e(name.slice(0,a))+'<mark>'+e(name.slice(a,b))+'</mark>'+e(name.slice(b))};
  function draw(w,q){
    const inp=w.querySelector('input'),l=w.querySelector('.cbx-l');
    if(!w._o)try{w._o=JSON.parse(w.dataset.opts)}catch(e){w._o=[]}
    const toks=nz(q).split(/\s+/).filter(Boolean);
    const list=w._o.filter(n=>toks.every(t=>nz(n).includes(t)));
    const one=list.filter(n=>!isM(n)),mul=list.filter(isM);
    const item=n=>`<div class="cbx-i${n===inp.value?' sel':''}" data-v="${esc(n)}">${hl(n,toks)}</div>`;
    l.innerHTML=(one.length?(mul.length?'<div class="cbx-g">Quốc gia</div>':'')+one.map(item).join(''):'')+(mul.length?'<div class="cbx-g">Gói nhiều nước</div>'+mul.map(item).join(''):'')||'<div class="cbx-e">Không có kết quả — vẫn có thể gõ tên tự do.</div>';
    l.hidden=false;act={w,l,inp};idx=-1;
  }
  let skip=false;function pick(v){const a=act;if(!a)return;a.inp.value=v;close();skip=true;try{a.inp.blur()}catch(e){}try{a.inp.dispatchEvent(new Event('input',{bubbles:true}));a.inp.dispatchEvent(new Event('change',{bubbles:true}))}finally{skip=false}}
  const mark=()=>{if(!act)return;const it=act.l.querySelectorAll('.cbx-i');it.forEach((x,i)=>x.classList.toggle('on',i===idx));if(it[idx])it[idx].scrollIntoView({block:'nearest'})};
  document.addEventListener('focusin',ev=>{const t=ev.target,w=t.closest&&t.closest('.cbx');if(!w||t.tagName!=='INPUT'){return}if(act&&act.w!==w)close();draw(w,'');t.select&&t.select()});
  document.addEventListener('input',ev=>{const t=ev.target,w=t.closest&&t.closest('.cbx');if(w&&t.tagName==='INPUT'&&!skip)draw(w,t.value)});
  document.addEventListener('keydown',ev=>{if(!act||ev.target!==act.inp)return;const it=act.l.querySelectorAll('.cbx-i');
    if(ev.key==='ArrowDown'){ev.preventDefault();idx=Math.min(it.length-1,idx+1);mark()}
    else if(ev.key==='ArrowUp'){ev.preventDefault();idx=Math.max(0,idx-1);mark()}
    else if(ev.key==='Enter'){if(it.length&&idx<0&&act.inp.value.trim()===''){}else if(it.length){ev.preventDefault();pick(it[idx>=0?idx:0].dataset.v)}}
    else if(ev.key==='Escape'){ev.stopPropagation();close()}},true);
  document.addEventListener('mousedown',ev=>{const i=ev.target.closest&&ev.target.closest('.cbx-i');if(i){ev.preventDefault();pick(i.dataset.v)}});
  document.addEventListener('focusout',ev=>{if(act&&ev.target===act.inp)setTimeout(close,0)});
})();

const stSegDays=l=>{if(l.pl==='Tháng'||!l.segs||!l.segs.length||!l.s||!l.e)return[];const set=new Set();l.segs.forEach(g=>{if(!g||!g.a||!g.b||g.b<g.a)return;stList(g.a,g.b).forEach(d=>{if(d>=l.s&&d<=l.e)set.add(d)})});return[...set].sort()};

const stList=(a,b)=>{const o=[];if(!a||!b)return o;let d=a,n=0;while(d<=b&&n<800){o.push(d);d=addDays(d,1);n++}return o};
const stImei=x=>String(x||'').replace(/\D/g,'').slice(-15);
const stDt=(d,t)=>{let dd=d;const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d);if(m)dd=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');let tt=t;if(/^\d{1,2}:\d{2}$/.test(tt))tt+=':00';const p=tt.split(':');tt=p[0].padStart(2,'0')+':'+p[1]+':'+p[2];return dd+' '+tt};
function stParseUsage(txt){
  const re=/(\d{14,16})\D{1,8}(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})[ T]+(\d{1,2}:\d{2}(?::\d{2})?)\D{1,8}(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})[ T]+(\d{1,2}:\d{2}(?::\d{2})?)[^A-Za-z0-9]{0,8}([A-Za-z]{2,3})\b[^\d\-]{0,14}(\d+(?:[.,]\d+)?)/g;

    const mbs=m[7];const mb=parseFloat(mbs.indexOf('.')<0&&mbs.indexOf(',')>=0?mbs.replace(',','.'):mbs.replace(/,/g,''));
    out.push({i:stImei(m[1]),s:stDt(m[2],m[3]),e:stDt(m[4],m[5]),c:m[6].toUpperCase(),mb:isNaN(mb)?0:mb});

const stMerge=(cur,add)=>{const k=g=>g.i+'|'+g.s+'|'+g.e;const seen=new Set(cur.map(k));const r=cur.slice();let n=0;add.forEach(g=>{if(!seen.has(k(g))){seen.add(k(g));r.push(g);n++}});r.sort((a,b)=>a.i<b.i?-1:a.i>b.i?1:a.s<b.s?1:-1);return{list:r,added:n}};
function stRate(l,c){

/* gán từng ngày sử dụng (giờ Việt Nam) cho dòng thuê của máy */
function stUsageMap(lines,logs){
  const R=stRules();const out={};const byImei={};
  (logs||[]).forEach(g=>{(byImei[g.i]=byImei[g.i]||[]).push(g)});
  const grp={};lines.forEach(l=>{if(l.inc===false||l.pl==='Tháng')return;const im=stImei(l.imei);(grp[im]=grp[im]||[]).push(l)});
  Object.keys(grp).forEach(im=>{
    const ls=grp[im].slice().sort((a,b)=>(a.s||'')<(b.s||'')?-1:1);
    const logsI=byImei[im]||[];
    ls.forEach(l=>{out[l.key]={has:logsI.length>0,used:[],extra:[],ignored:0,dc:{}}});
    const days={};
    logsI.forEach(g=>{if(!(g.mb>=R.minMb))return;let d=g.s.slice(0,10);const e=g.e.slice(0,10);let n=0;while(d<=e&&n<400){(days[d]=days[d]||new Set()).add(g.c);d=addDays(d,1);n++}});
    Object.keys(days).sort().forEach(d=>{
      let tgt=ls.find(l=>l.s&&l.e&&l.s<=d&&d<=l.e);let ex=false;
      if(!tgt){const prev=ls.filter(l=>l.e&&l.e<d);tgt=prev.length?prev[prev.length-1]:null;
        if(!tgt||d>addDays(tgt.e,14)){const u0=out[(tgt||ls[0]).key];u0.ignored++;return}ex=true}
      const u=out[tgt.key];(ex?u.extra:u.used).push(d);u.dc[d]=[...days[d]];
    });
  });
  return out;
}
function stCalc(l,u,vatPct){
  const R=stRules();
  if(l.pl==='Tháng'){const n=Math.max(1,+l.nm||1);const base=Math.round((+l.price||0)*n*Math.max(1,Math.round(+l.qty||1)));const disc=Math.round(base*(+l.dpct||0)/100);const ex=base-disc+(+l.ins||0)+(+l.ship||0)+(+l.other||0);const vat=Math.round(ex*(+vatPct||0)/100);
    return{reg:n,usedN:null,extraN:0,mode:'reg',days:n,base,disc,other:+l.other||0,sug:0,ex,vat,total:ex+vat,price:+l.price||0,minD:0,has:false,month:true}}
  const reg=(l.s&&l.e)?stList(l.s,l.e).length:(+l.days||0);
  const sd=l.unused?[]:stSegDays(l);
  if(stSegOn(l)){
    const qn=Math.max(1,Math.round(+l.qty||1));const units=l.unused?0:stSegUnits(l);const base=Math.round((+l.price||0)*units*qn);const minD=Math.round(reg*R.minPct/100);
    const hold=sd.length===0?'all':(sd.length*100<reg*R.minPct?'flat':'');
    const sug=hold==='all'?reg*R.act:hold==='flat'?R.act:0;const other=l.om?(+l.other||0):sug;
    const disc=Math.round(base*(+l.dpct||0)/100);const ex=base-disc+(+l.ins||0)+(+l.ship||0)+other;const vat=Math.round(ex*(+vatPct||0)/100);
    return{reg,usedN:sd.length,extraN:0,mode:'seg',days:units,units,base,disc,other,sug,ex,vat,total:ex+vat,price:+l.price||0,minD,has:true,seg:true,hold};
  }
  const has=!!(u&&u.has);const mode=l.mode||(has?'actual':'reg');
  const rateOf=d=>{const cs=(u&&u.dc&&u.dc[d])||[];return cs.length?Math.max.apply(null,cs.map(c=>stRate(l,c))):(+l.price||0)};
  let rates=[];
  if(mode==='actual'&&has){rates=[].concat(u.used,u.extra).sort().map(rateOf)}
  else{const win=stList(l.s,l.e);rates=win.map(rateOf);if(has)u.extra.forEach(d=>rates.push(rateOf(d)));if(!win.length&&reg)rates=Array(reg).fill(+l.price||0)}
  const qn=Math.max(1,Math.round(+l.qty||1));const days=rates.length;const base=Math.round(rates.reduce((a,b)=>a+b,0)*qn);
